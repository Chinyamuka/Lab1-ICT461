```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <h1>Course Registration</h1>
        <p>Register for your preferred course</p>
    </header>

    <main>
        <section class="registration-section">

            <form id="regForm">

                <div class="field-group">
                    <label for="name">
                        Full Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. John Doe"
                        required
                        minlength="2"
                    >

                    <div class="error">
                        Please enter your full name.
                    </div>
                </div>

                <div class="field-group">
                    <label for="studentId">
                        Student ID <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        name="studentId"
                        placeholder="e.g. STU-2025-001"
                        required
                        pattern="[A-Za-z]{3}-\d{4}-\d{3}"
                    >

                    <div class="error">
                        Use the format STU-2025-001.
                    </div>
                </div>

                <div class="field-group">
                    <label for="programme">
                        Programme <span class="required">*</span>
                    </label>

                    <select id="programme" name="programme" required>
                        <option value="" disabled selected>
                            — Select a programme —
                        </option>

                        <option value="CS">Computer Science</option>
                        <option value="DS">Data Science</option>
                        <option value="EE">Electrical Engineering</option>
                        <option value="BA">Business Administration</option>
                    </select>
                </div>

                <div class="field-group">
                    <label for="course">
                        Course <span class="required">*</span>
                    </label>

                    <select id="course" name="course" required>
                        <option value="" disabled selected>
                            — Select a course —
                        </option>

                        <option value="CS101">
                            CS101 – Intro to Programming
                        </option>

                        <option value="CS205">
                            CS205 – Data Structures
                        </option>

                        <option value="DS501">
                            DS501 – Machine Learning
                        </option>

                        <option value="EE210">
                            EE210 – Circuit Analysis
                        </option>
                    </select>
                </div>

                <button type="submit">
                    Submit Registration
                </button>

                <p id="message" class="message"></p>

            </form>

        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Course Registration System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
```
